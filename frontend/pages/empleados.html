<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RRHH — Empleados</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">🏢</div>
        <span>RRHH Sistema</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Principal</div>
        <div class="nav-item" onclick="window.location.href='dashboard.html'">
          <span class="nav-icon">📊</span> Dashboard
        </div>
        <div class="nav-section-label">Gestión</div>
        <div class="nav-item active">
          <span class="nav-icon">👥</span> Empleados
        </div>
        <div class="nav-item" onclick="window.location.href='asistencias.html'">
          <span class="nav-icon">⏰</span> Asistencias
        </div>
        <div class="nav-item" onclick="window.location.href='vacaciones.html'">
          <span class="nav-icon">🌴</span> Vacaciones
        </div>
        <div class="nav-section-label" id="adminSection">Administración</div>
        <div class="nav-item" id="navDepartamentos" onclick="window.location.href='departamentos.html'">
          <span class="nav-icon">🏗️</span> Departamentos
        </div>
        <div class="nav-item" id="navCargos" onclick="window.location.href='cargos.html'">
          <span class="nav-icon">💼</span> Cargos
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">--</div>
          <div class="user-details">
            <div class="user-name" id="userName">--</div>
            <div class="user-role" id="userRole">--</div>
          </div>
          <button class="btn-logout" onclick="logout()" title="Cerrar sesión">⏻</button>
        </div>
      </div>
    </aside>

    <!-- CONTENIDO -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Empleados</h1>
          <p>Gestión del personal de la empresa</p>
        </div>
        <button class="btn btn-primary" id="btnNuevoEmpleado" style="width:auto;">
          + Nuevo empleado
        </button>
      </div>

      <div class="page-body">
        <div class="table-container">
          <div class="table-header">
            <h2 id="totalEmpleados">Empleados</h2>
            <div class="table-actions">
              <input type="text" class="search-input" id="searchInput" placeholder="Buscar por nombre o documento...">
              <select id="filtroEstado" style="padding:7px 12px; border:1.5px solid var(--gray-border); border-radius:6px; font-size:13px; outline:none;">
                <option value="">Todos los estados</option>
                <option value="ACTIVO">Activo</option>
                <option value="CESADO">Cesado</option>
                <option value="SUSPENDIDO">Suspendido</option>
              </select>
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th>Empleado</th>
                <th>Documento</th>
                <th>Cargo</th>
                <th>Contrato</th>
                <th>Días vacac.</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaEmpleados">
              <tr><td colspan="7"><div class="loading"><div class="spinner"></div> Cargando...</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL CREAR/EDITAR EMPLEADO -->
  <div class="modal-overlay" id="modalEmpleado">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Nuevo empleado</h3>
        <button class="btn-close" onclick="cerrarModal()">✕</button>
      </div>
      <div class="modal-body">
        <div id="alertModal" class="alert alert-error"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div class="form-group">
            <label>Nombre *</label>
            <input type="text" id="empNombre" placeholder="Juan">
          </div>
          <div class="form-group">
            <label>Apellido paterno *</label>
            <input type="text" id="empApellidoP" placeholder="Pérez">
          </div>
          <div class="form-group">
            <label>Apellido materno</label>
            <input type="text" id="empApellidoM" placeholder="García">
          </div>
          <div class="form-group">
            <label>Tipo documento *</label>
            <select id="empTipoDoc">
              <option value="DNI">DNI</option>
              <option value="CE">Carné de Extranjería</option>
              <option value="PASAPORTE">Pasaporte</option>
            </select>
          </div>
          <div class="form-group">
            <label>Número documento *</label>
            <input type="text" id="empNumDoc" placeholder="12345678">
          </div>
          <div class="form-group">
            <label>Fecha nacimiento</label>
            <input type="date" id="empFechaNac">
          </div>
          <div class="form-group">
            <label>Teléfono</label>
            <input type="text" id="empTelefono" placeholder="987654321">
          </div>
          <div class="form-group">
            <label>Email personal</label>
            <input type="email" id="empEmailP" placeholder="juan@gmail.com">
          </div>
          <div class="form-group">
            <label>Email corporativo</label>
            <input type="email" id="empEmailC" placeholder="juan@empresa.com">
          </div>
          <div class="form-group">
            <label>Departamento</label>
            <select id="empDepartamento">
              <option value="">Sin departamento</option>
            </select>
          </div>
          <div class="form-group">
            <label>Cargo</label>
            <select id="empCargo">
              <option value="">Sin cargo</option>
            </select>
          </div>
          <div class="form-group">
            <label>Tipo contrato *</label>
            <select id="empTipoContrato">
              <option value="INDEFINIDO">Indefinido</option>
              <option value="PLAZO_FIJO">Plazo fijo</option>
              <option value="CAS">CAS</option>
              <option value="PRACTICAS">Prácticas</option>
            </select>
          </div>
          <div class="form-group">
            <label>Fecha contrato *</label>
            <input type="date" id="empFechaContrato">
          </div>
          <div class="form-group">
            <label>Salario (S/.) *</label>
            <input type="number" id="empSalario" placeholder="2000.00" step="0.01">
          </div>
          <div class="form-group">
            <label>Días vacaciones</label>
            <input type="number" id="empDiasVac" placeholder="30" value="30">
          </div>
        </div>
        <div class="form-group">
          <label>Dirección</label>
          <input type="text" id="empDireccion" placeholder="Av. Ejemplo 123, Lima">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn btn-primary" style="width:auto;" id="btnGuardar" onclick="guardarEmpleado()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL CESE -->
  <div class="modal-overlay" id="modalCese">
    <div class="modal" style="max-width:380px;">
      <div class="modal-header">
        <h3>Cesar empleado</h3>
        <button class="btn-close" onclick="cerrarModalCese()">✕</button>
      </div>
      <div class="modal-body">
        <div id="alertCese" class="alert alert-error"></div>
        <div class="form-group">
          <label>Fecha de cese *</label>
          <input type="date" id="ceseFecha">
        </div>
        <div class="form-group">
          <label>Motivo *</label>
          <input type="text" id="cesMotivo" placeholder="Renuncia voluntaria">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModalCese()">Cancelar</button>
        <button class="btn btn-danger" style="width:auto;" onclick="confirmarCese()">Confirmar cese</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/empleados.js"></script>
</body>
</html>
