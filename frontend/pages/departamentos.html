<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RRHH — Departamentos</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">🏢</div>
        <span>RRHH Sistema</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Principal</div>
        <div class="nav-item" onclick="window.location.href='dashboard.html'">
          <span class="nav-icon">📊</span> Dashboard
        </div>
        <div class="nav-section-label">Gestión</div>
        <div class="nav-item" onclick="window.location.href='empleados.html'">
          <span class="nav-icon">👥</span> Empleados
        </div>
        <div class="nav-item" onclick="window.location.href='asistencias.html'">
          <span class="nav-icon">⏰</span> Asistencias
        </div>
        <div class="nav-item" onclick="window.location.href='vacaciones.html'">
          <span class="nav-icon">🌴</span> Vacaciones
        </div>
        <div class="nav-section-label">Administración</div>
        <div class="nav-item active">
          <span class="nav-icon">🏗️</span> Departamentos
        </div>
        <div class="nav-item" onclick="window.location.href='cargos.html'">
          <span class="nav-icon">💼</span> Cargos
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">--</div>
          <div class="user-details">
            <div class="user-name" id="userName">--</div>
            <div class="user-role" id="userRole">--</div>
          </div>
          <button class="btn-logout" onclick="logout()" title="Cerrar sesión">⏻</button>
        </div>
      </div>
    </aside>

    <!-- CONTENIDO -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Departamentos</h1>
          <p>Gestión de departamentos de la empresa</p>
        </div>
        <button class="btn btn-primary" style="width:auto;" onclick="abrirModal()">
          + Nuevo departamento
        </button>
      </div>

      <div class="page-body">
        <div class="table-container">
          <div class="table-header">
            <h2 id="totalDepts">Departamentos</h2>
            <input type="text" class="search-input" id="searchInput" placeholder="Buscar departamento...">
          </div>
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Jefe ID</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaDepts">
              <tr><td colspan="5"><div class="loading"><div class="spinner"></div> Cargando...</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalDept">
    <div class="modal" style="max-width:420px;">
      <div class="modal-header">
        <h3 id="modalTitle">Nuevo departamento</h3>
        <button class="btn-close" onclick="cerrarModal()">✕</button>
      </div>
      <div class="modal-body">
        <div id="alertModal" class="alert alert-error"></div>
        <div class="form-group">
          <label>Nombre *</label>
          <input type="text" id="deptNombre" placeholder="Tecnología">
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <input type="text" id="deptDescripcion" placeholder="Equipo de desarrollo y sistemas">
        </div>
        <div class="form-group">
          <label>Jefe (ID de empleado)</label>
          <input type="number" id="deptJefeId" placeholder="Dejar vacío si no tiene jefe aún">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn btn-primary" style="width:auto;" onclick="guardar()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/departamentos.js"></script>
</body>
</html>
